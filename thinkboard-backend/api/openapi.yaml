openapi: 3.0.3
info:
  title: ThinkBoard Gateway API
  description: >
    Currently implemented route surface of the Go gateway (thinkboard-backend). Authentication
    is issued by Supabase Auth, not this service; the gateway verifies the resulting Supabase JWT
    and resolves it to a profile_id (internal/httpapi/middleware/auth.go).
  version: 0.0.1
servers:
  - url: http://localhost:8080
security: []
paths:
  /healthz:
    get:
      summary: Liveness check
      description: Public, unauthenticated. Always available while the process is up.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
  /v1/me:
    get:
      summary: Resolve the caller's profile id
      description: >
        Verifies the Supabase-issued Bearer JWT and resolves auth.users.id to
        public.profile_identities.profile_id.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id:
                    type: string
        "401":
          description: Missing, invalid, or unresolvable bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: missing bearer token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access_token (see api/api.json's "Supabase Auth" folder for how to obtain one).
